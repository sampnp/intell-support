# Postgres, Qdrant, the FastAPI backend (WP1) and the Vite frontend dev server (WP8).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-support}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-support_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Container-network addresses. These override .env, where POSTGRES_PORT / QDRANT_PORT
      # are the ports published on the host.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      QDRANT_URL: http://qdrant:6333
      SAMPLE_KB_DIR: /sample_kb
      # File events don't cross Windows/OneDrive bind mounts; poll for --reload.
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --reload"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Sample KB for tests, the seed script and scripts/build_sample_kb.py (writes PDFs here).
      - ./sample_kb:/sample_kb
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    # uvicorn --reload opens the port before the app can answer; "healthy" means /api/health
    # really responded (it is always 200, reporting "degraded" when a dependency is down).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"
      interval: 5s
      timeout: 6s
      start_period: 20s
      retries: 30

  frontend:
    build: ./frontend
    # Provides VITE_API_BASE_URL (the browser calls the backend directly; CORS allows :5173).
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Keep the image's node_modules instead of the (absent) host folder.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  qdrant_storage:
